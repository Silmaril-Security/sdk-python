name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langchain]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q -m "not integration"

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

  alpha-integration:
    name: Alpha integration
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SILMARIL_API_KEY: ${{ secrets.SILMARIL_API_KEY }}
      SILMARIL_API_URL: ${{ secrets.SILMARIL_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langchain]"

      - name: Verify live credentials
        run: |
          test -n "$SILMARIL_API_KEY" || { echo "::error::SILMARIL_API_KEY repo secret is required"; exit 1; }
          test -n "$SILMARIL_API_URL" || { echo "::error::SILMARIL_API_URL repo secret is required"; exit 1; }

      - name: Run alpha integration tests
        run: pytest -q -m integration tests/integ
